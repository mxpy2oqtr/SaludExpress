<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="SaludExpress - Plataforma líder en gestión y consulta de resultados médicos. Acceso seguro y rápido a sus análisis clínicos."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>SaludExpress - Dashboard Médico</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        background-color: #f4f7f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #333;
      }
      .loading-container {
        text-align: center;
      }
      .loading-spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: #09f;
        animation: spin 1s ease infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .loading-text {
        font-size: 1.2rem;
        font-weight: 500;
      }
      noscript {
        width: 100%;
        padding: 20px;
        background-color: #ffcdd2;
        color: #c62828;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>JavaScript Requerido</strong>
      <p>Para acceder a SaludExpress, necesita habilitar JavaScript en su navegador.</p>
      <p>SaludExpress es una plataforma segura para la gestión y consulta de resultados médicos.</p>
    </noscript>
    <div id="root">
      <div class="loading-container">
        <div class="loading-spinner"></div>
        <p class="loading-text">Cargando su plataforma médica segura...</p>
      </div>
    </div>
  </body>
</html>
